# Example secrets file - DO NOT commit actual secrets to git
# Create actual secrets using: kubectl create secret generic big-bus-secrets --from-env-file=.env -n big-bus
apiVersion: v1
kind: Secret
metadata:
  name: big-bus-secrets
  namespace: big-bus
type: Opaque
stringData:
  # Database
  DATABASE_URL: 'postgresql://user:password@postgres-service:5432/bigbus_db'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'changeme'

  # Redis
  REDIS_PASSWORD: 'changeme'

  # JWT
  JWT_SECRET: 'your-super-secret-jwt-key-change-me'
  JWT_REFRESH_SECRET: 'your-super-secret-refresh-key-change-me'

  # Payment Gateways
  VNPAY_TMN_CODE: 'your-vnpay-tmn-code'
  VNPAY_HASH_SECRET: 'your-vnpay-hash-secret'
  MOMO_PARTNER_CODE: 'your-momo-partner-code'
  MOMO_ACCESS_KEY: 'your-momo-access-key'
  MOMO_SECRET_KEY: 'your-momo-secret-key'
  ZALOPAY_APP_ID: 'your-zalopay-app-id'
  ZALOPAY_KEY1: 'your-zalopay-key1'
  ZALOPAY_KEY2: 'your-zalopay-key2'

  # OAuth2
  GOOGLE_CLIENT_ID: 'your-google-client-id'
  GOOGLE_CLIENT_SECRET: 'your-google-client-secret'
  FACEBOOK_APP_ID: 'your-facebook-app-id'
  FACEBOOK_APP_SECRET: 'your-facebook-app-secret'
  ZALO_APP_ID: 'your-zalo-app-id'
  ZALO_APP_SECRET: 'your-zalo-app-secret'

  # Email
  SMTP_HOST: 'smtp.gmail.com'
  SMTP_PORT: '587'
  SMTP_USER: 'your-email@gmail.com'
  SMTP_PASS: 'your-app-password'

  # SMS
  TWILIO_ACCOUNT_SID: 'your-twilio-account-sid'
  TWILIO_AUTH_TOKEN: 'your-twilio-auth-token'
  TWILIO_PHONE_NUMBER: 'your-twilio-phone'

  # Sentry
  SENTRY_DSN: 'your-sentry-dsn'

  # RabbitMQ
  RABBITMQ_URL: 'amqp://user:password@rabbitmq-service:5672'
